[package]
name = "texel-ps1-gpu"
description = "The PlayStation's GPU at higher resolutions on the GPU (wgpu: Vulkan, Metal, DX12 natively; WebGPU in browsers)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
texel-ps1.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.wgpu]
version = "=30.0.2"
default-features = false
features = ["wgsl", "std", "vulkan", "metal", "dx12"]

[target.'cfg(target_arch = "wasm32")'.dependencies.wgpu]
version = "=30.0.2"
default-features = false
features = ["wgsl", "std", "webgpu"]

[dev-dependencies]
texel-disc.workspace = true

[lints]
workspace = true
