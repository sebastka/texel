# Texel on Kubernetes: an example. Provide yourself:
# - the `texel-library` PersistentVolumeClaim, holding `ps1/bios/`,
#   `ps1/games/`, `ps2/bios/` and `ps2/games/` (mounted read-only; e.g. an
#   NFS share). Other layouts, or several directories per kind: set
#   TEXEL_PS1_BIOS, TEXEL_PS1_GAMES, TEXEL_PS2_BIOS and TEXEL_PS2_GAMES below
#   (directories separated by `:`);
# - a MariaDB (or MySQL) database for users, saves and hashes, and the
#   `texel-database` Secret with its URL under `url`:
#   mysql://user:password@host:3306/database (the server creates its tables);
# - the `texel` Secret with the sign-in settings: TEXEL_OIDC_ISSUER,
#   TEXEL_OIDC_CLIENT_ID, TEXEL_OIDC_CLIENT_SECRET, TEXEL_OIDC_ADMIN_GROUPS
#   (or TEXEL_OIDC_ADMIN_USERS), and optionally TEXEL_IGDB_CLIENT_ID and
#   TEXEL_IGDB_CLIENT_SECRET, for game details from IGDB. Without OpenID
#   Connect, invite users with `texel --create-invite "note"` (in the pod);
# - TEXEL_PUBLIC_URL below: the address users reach Texel at (the OpenID
#   Connect redirect URI is <it>/auth/oidc/callback);
# - an Ingress in front of the Service, over HTTPS. It must pass WebSocket
#   upgrades (netplay, under /api/netplay/), and keep the server's
#   Cross-Origin-Opener-Policy and Cross-Origin-Embedder-Policy headers (the
#   emulators need SharedArrayBuffer).
# Netplay rooms live in the server's memory: keep a single replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: texel
  labels: { app.kubernetes.io/name: texel }
spec:
  replicas: 1
  # One pod at a time: netplay rooms live in its memory.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: texel }
  template:
    metadata:
      labels: { app.kubernetes.io/name: texel }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: texel
          image: ghcr.io/sebastka/texel:edge
          env:
            - { name: TEXEL_LOG_FORMAT, value: json }
            - { name: TEXEL_PUBLIC_URL, value: https://texel.example.com }
            - name: TEXEL_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: texel-database, key: url }
          envFrom:
            - secretRef: { name: texel, optional: true }
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 20m, memory: 256Mi }
            # Scanning a large library and indexing its zipped images stay
            # well under this (files read once leave the page cache).
            limits: { memory: 1Gi }
          startupProbe:
            httpGet: { path: /readyz, port: http }
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 60
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 30
          volumeMounts:
            - { name: library, mountPath: /library, readOnly: true }
            - { name: state, mountPath: /state }
      volumes:
        - name: library
          persistentVolumeClaim: { claimName: texel-library, readOnly: true }
        - name: state
          persistentVolumeClaim: { claimName: texel-state }
---
# The state directory: caches only (DATs, artwork, game details, and the
# zipped images' seek indexes, about 1% of their size), filled again if
# lost, but downloading and indexing again take a while.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: texel-state
  labels: { app.kubernetes.io/name: texel }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: texel
  labels: { app.kubernetes.io/name: texel }
spec:
  selector: { app.kubernetes.io/name: texel }
  ports:
    - { name: http, port: 80, targetPort: http }
