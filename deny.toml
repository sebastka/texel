# cargo-deny: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# The workspace crates are private and unlicensed.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between the (unpublished) workspace crates.
allow-wildcard-paths = true
# ring is the rustls provider: no cmake/clang in the build image.
deny = [{ crate = "aws-lc-rs", reason = "ring is used as the rustls provider" }, { crate = "openssl-sys", reason = "rustls only" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
