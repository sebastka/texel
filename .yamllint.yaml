# yamllint configuration: https://yamllint.readthedocs.io/
extends: default

ignore-from-file: [.gitignore]

rules:
  line-length:
    max: 140
  document-start: disable
  comments:
    min-spaces-from-content: 1
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
  truthy:
    check-keys: true
  quoted-strings:
    quote-type: double
    required: only-when-needed
    # Generated by pnpm.
    ignore: [frontend/pnpm-lock.yaml]
