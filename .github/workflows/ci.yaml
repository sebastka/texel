name: CI

'on':
  push:
    branches: [master]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain, components and targets of rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked -p texel-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --locked

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run yamllint==1.38.0 --strict .

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories bans licenses sources

  # Also builds and typechecks the web app.
  docker:
    runs-on: ubuntu-latest
    # The database the server needs, for the smoke test.
    services:
      mariadb:
        image: mariadb:11.8@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc
        env:
          MARIADB_RANDOM_ROOT_PASSWORD: "1"
          MARIADB_DATABASE: texel
          MARIADB_USER: texel
          MARIADB_PASSWORD: ci
        ports: [127.0.0.1:3306:3306]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: texel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Signed out, the library is closed; with an invitation, registered,
      # it opens.
      - name: Smoke test the image
        run: |
          mkdir -p library/bios library/games
          docker run -d --name texel --network host -e TEXEL_FETCH_METADATA=false \
            -e TEXEL_DATABASE_URL=mysql://texel:ci@127.0.0.1:3306/texel \
            -v "$PWD/library:/library:ro" --tmpfs /state:uid=65532 texel:ci
          for _ in $(seq 60); do curl -fsS localhost:8080/readyz && break; sleep 1; done
          curl -fsS -o /dev/null localhost:8080/
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/games)" = 401
          token="$(docker exec texel /usr/local/bin/texel --create-invite ci | head -n 1)"
          curl -fsS -c jar -H 'content-type: application/json' localhost:8080/api/auth/register \
            -d "{\"token\":\"$token\",\"email\":\"ci@example.com\",\"name\":\"CI\",\"password\":\"a long enough password\"}"
          curl -fsS -b jar -o /dev/null localhost:8080/api/games
          docker exec texel /usr/local/bin/texel --healthcheck
      - name: Server log
        if: failure()
        run: docker logs texel
